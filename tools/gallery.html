<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>HD Export Gallery</title>
<style>
  body { background:#16161d; color:#d7d7e0; font-family:ui-monospace,monospace; margin:0; padding:20px; }
  h1 { font-size:16px; } h1 small{color:#8a8aa0;font-weight:normal;}
  h2 { font-size:13px; color:#8ad08a; text-transform:uppercase; letter-spacing:1px; margin:26px 0 10px; }
  .grid { display:flex; flex-wrap:wrap; gap:14px; }
  figure { margin:0; }
  img { height:270px; border:1px solid #2a2a36; border-radius:4px; display:block; background:#000; }
  figcaption { font-size:10px; color:#8a8aa0; margin-top:4px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chips img { height:128px; }
</style>
</head>
<body>
<h1>HD Export Gallery <small>— public/game/hd/</small></h1>
<h2>Balloon Fight (USA) — screenshots</h2>
<div class="grid">
  <figure><img src="../game/balloon-fight-usa/hd/screenshots/title.png"><figcaption>title.png</figcaption></figure>
  <figure><img src="../game/balloon-fight-usa/hd/screenshots/gameplay-1p.png"><figcaption>gameplay-1p.png</figcaption></figure>
  <figure><img src="../game/balloon-fight-usa/hd/screenshots/gameplay-2p.png"><figcaption>gameplay-2p.png</figcaption></figure>
  <figure><img src="../game/balloon-fight-usa/hd/screenshots/balloon-trip.png"><figcaption>balloon-trip.png</figcaption></figure>
  <figure><img src="../game/balloon-fight-usa/hd/screenshots/attract-demo.gif"><figcaption>attract-demo.gif</figcaption></figure>
</div>
<h2>Balloon Fight — characters</h2>
<div class="chips">
  <figure><img src="../game/balloon-fight-usa/hd/sprites/player1-sheet.png"><figcaption>player1-sheet</figcaption></figure>
  <figure><img src="../game/balloon-fight-usa/hd/sprites/player2-sheet.png"><figcaption>player2-sheet</figcaption></figure>
  <figure><img src="../game/balloon-fight-usa/hd/sprites/enemy-sheet.png"><figcaption>enemy-sheet</figcaption></figure>
</div>
<h2>Nuts &amp; Milk (Japan) — screenshots</h2>
<div class="grid">
  <figure><img src="../game/nuts-milk-japan/hd/screenshots/title.png"><figcaption>title.png</figcaption></figure>
  <figure><img src="../game/nuts-milk-japan/hd/screenshots/gameplay-1p.png"><figcaption>gameplay-1p.png</figcaption></figure>
  <figure><img src="../game/nuts-milk-japan/hd/screenshots/attract-demo.gif"><figcaption>attract-demo.gif</figcaption></figure>
</div>
<h2>Nuts &amp; Milk — characters</h2>
<div class="chips">
  <figure><img src="../game/nuts-milk-japan/hd/sprites/player1-sheet.png"><figcaption>player1-sheet (16×16 → 64×64)</figcaption></figure>
  <figure><img src="../game/nuts-milk-japan/hd/sprites/enemy-sheet.png"><figcaption>enemy-sheet</figcaption></figure>
</div>
</body>
</html>
